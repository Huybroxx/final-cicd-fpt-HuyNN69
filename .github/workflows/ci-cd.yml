name: FastAPI CI/CD Pipeline with SonarQube & Blue-Green Deployment

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: "fastapi-devops-app"

jobs:
  # ----------------------------------------------------------------------------
  # Stage 1: Lint
  # ----------------------------------------------------------------------------
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Linting Tools
        run: pip install flake8 black

      - name: Run Linters
        run: |
          flake8 app/ tests/ --max-line-length=100
          black --check app/ tests/ --line-length=100

  # ----------------------------------------------------------------------------
  # Stage 2: Test & Coverage
  # ----------------------------------------------------------------------------
  test:
    name: Automated Unit Testing & Coverage
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Dependencies
        run: pip install -r requirements-dev.txt

      - name: Execute Tests with Pytest
        run: |
          pytest -v --cov=app --cov-report=xml:coverage.xml --junitxml=test-results.xml tests/

      - name: Upload Test and Coverage Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            coverage.xml
            test-results.xml

  # ----------------------------------------------------------------------------
  # Stage 3: SonarQube Quality Gate Scan
  # ----------------------------------------------------------------------------
  scan:
    name: SonarQube Quality Gate Scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Repository (Full History for Sonar)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Test Artifacts
        uses: actions/download-artifact@v4
        with:
          name: test-artifacts

      - name: Run SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Enforce SonarQube Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ----------------------------------------------------------------------------
  # Stage 4: Docker Build
  # ----------------------------------------------------------------------------
  build:
    name: Build Multi-Stage Docker Image
    runs-on: ubuntu-latest
    needs: scan
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} -t ${{ env.IMAGE_NAME }}:latest .

  # ----------------------------------------------------------------------------
  # Stage 5: Zero-Downtime Blue-Green Deploy
  # ----------------------------------------------------------------------------
  deploy:
    name: Zero-Downtime Blue-Green Deployment
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Execute Blue-Green Deploy Script
        run: |
          chmod +x ./scripts/blue_green_deploy.sh ./scripts/rollback.sh
          ./scripts/blue_green_deploy.sh
