name: CI-CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  IMAGE_NAME: fastapi-devops-app

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install flake8 black
      - run: |
          flake8 backend/app/ backend/tests/ --max-line-length=100 --extend-ignore=E203,W503
          black --check backend/app/ backend/tests/ --line-length=100

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - run: |
          cd backend
          pip install -r requirements-dev.txt
          pytest -v --cov=app --cov-report=xml:coverage.xml --junitxml=test-results.xml tests/
      - uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            backend/coverage.xml
            backend/test-results.xml

  scan:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: test-artifacts
          path: backend
      - name: Verify and normalize test artifacts path
        run: |
          if [ -d backend/backend ]; then
            cp -r backend/backend/* backend/
          fi
          test -f backend/coverage.xml && echo "Verified backend/coverage.xml exists."
      - name: SonarQube scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if [ -n "$SONAR_TOKEN" ] && [ -n "$SONAR_HOST_URL" ]; then
            echo "Executing SonarQube Scanner CLI against $SONAR_HOST_URL..."
            docker run --rm \
              -e SONAR_HOST_URL="$SONAR_HOST_URL" \
              -e SONAR_TOKEN="$SONAR_TOKEN" \
              -v "${PWD}:/usr/src" \
              sonarsource/sonar-scanner-cli:latest \
              sonar-scanner -Dsonar.qualitygate.wait=true
          else
            echo "::warning ::SONAR_TOKEN and SONAR_HOST_URL are not configured in GitHub Secrets. Skipping SonarQube Quality Gate scan."
          fi

  build:
    runs-on: ubuntu-latest
    needs: scan
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} -t ${{ env.IMAGE_NAME }}:latest ./backend

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to production VPS
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST || '161.118.195.1' }}
          SERVER_USER: ${{ secrets.SERVER_USER || 'ubuntu' }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error ::SSH_PRIVATE_KEY secret is not configured in GitHub Secrets!"
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" "
            set -e
            echo 'Deploying to production server...'
            cd /opt/finaldevops
            git fetch origin main
            git reset --hard origin/main
            chmod +x ./scripts/blue_green_deploy.sh ./scripts/rollback.sh
            ./scripts/blue_green_deploy.sh
          "