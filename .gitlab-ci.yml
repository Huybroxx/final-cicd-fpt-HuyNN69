# ==============================================================================
# GitLab CI/CD Pipeline - FastAPI with SonarQube Quality Gate & Blue-Green Deploy
# ==============================================================================

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  IMAGE_NAME: "$CI_REGISTRY_IMAGE/fastapi-app"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  GIT_DEPTH: "0"

stages:
  - lint
  - test
  - scan
  - build
  - deploy

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip/
    - .sonar/cache/

# ==============================================================================
# Stage 1: Lint (Static Syntax & Style Checking)
# ==============================================================================
lint:
  stage: lint
  image: python:3.11-slim
  before_script:
    - pip install flake8 black
  script:
    - echo "=== Running Code Linters ==="
    - flake8 app/ tests/ --max-line-length=100 --exclude=__pycache__
    - black --check app/ tests/ --line-length=100
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# ==============================================================================
# Stage 2: Test (Automated Unit Tests & Coverage Report Generation)
# ==============================================================================
test:
  stage: test
  image: python:3.11-slim
  before_script:
    - pip install -r requirements-dev.txt
  script:
    - echo "=== Running Pytest Unit Tests and Generating Coverage ==="
    - pytest -v --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --junitxml=test-results.xml tests/
  artifacts:
    when: always
    paths:
      - coverage.xml
      - test-results.xml
    reports:
      junit: test-results.xml
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# ==============================================================================
# Stage 3: Scan (SonarQube Analysis & Mandatory Quality Gate Enforcement)
# ==============================================================================
sonarqube:scan:
  stage: scan
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  needs:
    - test
  script:
    - echo "=== Executing SonarQube Scanner CLI ==="
    - |
      sonar-scanner \
        -Dsonar.host.url="${SONAR_HOST_URL:-http://sonarqube:9000}" \
        -Dsonar.token="${SONAR_TOKEN}" \
        -Dsonar.qualitygate.wait=true
  # CRITICAL REQUIREMENT: allow_failure must be FALSE to block pipeline on failure
  allow_failure: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# ==============================================================================
# Stage 4: Build (Multi-Stage Docker Packaging & Registry Push)
# ==============================================================================
docker:build:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  needs:
    - sonarqube:scan
  before_script:
    - echo "Logging into GitLab Container Registry..."
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - echo "Building production multi-stage Docker image..."
    - docker build -t "$IMAGE_NAME:$IMAGE_TAG" -t "$IMAGE_NAME:latest" .
    - echo "Pushing Docker image to registry..."
    - docker push "$IMAGE_NAME:$IMAGE_TAG"
    - docker push "$IMAGE_NAME:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"

# ==============================================================================
# Stage 5: Deploy (Zero-Downtime Blue-Green Deployment & Auto-Rollback)
# ==============================================================================
deploy:blue-green:
  stage: deploy
  image: alpine:latest
  needs:
    - docker:build
  before_script:
    - apk add --no-cache bash curl openssh-client docker-cli docker-cli-compose
  script:
    - echo "=== Executing Blue-Green Zero-Downtime Deployment ==="
    - chmod +x ./scripts/blue_green_deploy.sh ./scripts/rollback.sh
    - ./scripts/blue_green_deploy.sh
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH == "main"
      when: manual
