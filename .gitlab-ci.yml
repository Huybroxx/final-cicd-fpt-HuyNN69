variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  IMAGE_NAME: "$CI_REGISTRY_IMAGE/fastapi-app"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  GIT_DEPTH: "0"

stages:
  - lint
  - test
  - scan
  - build
  - deploy

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip/
    - .sonar/cache/

lint:
  stage: lint
  image: python:3.11-slim
  before_script:
    - pip install flake8 black
  script:
    - flake8 backend/app/ backend/tests/ --max-line-length=100
    - black --check backend/app/ backend/tests/ --line-length=100
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

test:
  stage: test
  image: python:3.11-slim
  before_script:
    - cd backend
    - pip install -r requirements-dev.txt
  script:
    - pytest -v --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --junitxml=test-results.xml tests/
  artifacts:
    when: always
    paths:
      - backend/coverage.xml
      - backend/test-results.xml
    reports:
      junit: backend/test-results.xml
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

sonarqube:scan:
  stage: scan
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  needs:
    - test
  script:
    - |
      sonar-scanner \
        -Dsonar.host.url="${SONAR_HOST_URL:-http://sonarqube:9000}" \
        -Dsonar.token="${SONAR_TOKEN}" \
        -Dsonar.qualitygate.wait=true
  allow_failure: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

docker:build:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  needs:
    - sonarqube:scan
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -t "$IMAGE_NAME:$IMAGE_TAG" -t "$IMAGE_NAME:latest" ./backend
    - docker push "$IMAGE_NAME:$IMAGE_TAG"
    - docker push "$IMAGE_NAME:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH == "main"

deploy:blue-green:
  stage: deploy
  image: alpine:latest
  needs:
    - docker:build
  before_script:
    - apk add --no-cache bash curl docker-cli docker-cli-compose
  script:
    - chmod +x ./scripts/blue_green_deploy.sh ./scripts/rollback.sh
    - ./scripts/blue_green_deploy.sh
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH == "main"
      when: manual
