# ==============================================================================
# SonarQube Scanner Configuration for FastAPI Application
# ==============================================================================

# Project Identification
sonar.projectKey=fastapi-devops-final
sonar.projectName=FastAPI DevOps Final Service
sonar.projectVersion=1.0.0

# Source and Test Directories
sonar.sources=app
sonar.tests=tests

# Language Specification
sonar.language=py
sonar.python.version=3.11

# Source Encoding
sonar.sourceEncoding=UTF-8

# Test Execution and Code Coverage Reports
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml

# File Exclusions
sonar.exclusions=**/__pycache__/**,**/.venv/**,**/tests/**,**/nginx/**,**/scripts/**

# Quality Gate Wait Enforcement
sonar.qualitygate.wait=true
